<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 340px; padding: 12px; }
    button { width: 100%; padding: 8px; cursor: pointer; margin-top: 6px; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; }
    #status { margin-top: 8px; font-size: 13px; color: #555; }
    #preview { width: 100%; margin-top: 8px; border: 1px solid #ccc; display: none; }
    #domList { max-height: 120px; overflow-y: auto; font-size: 12px; margin-top: 8px; }
    #actionLog { max-height: 160px; overflow-y: auto; font-size: 12px; margin-top: 8px; }
    .sensitive { color: #c0392b; font-weight: bold; }
    .step { border-bottom: 1px solid #eee; padding: 4px 0; }
    .step b { color: #2c3e50; }
    hr { margin: 12px 0; border: none; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <input type="text" id="taskInput" placeholder="e.g. click the login button" />
  <button id="runTaskBtn">Run Agent</button>
  <div id="taskStatus">Idle.</div>
  <div id="actionLog"></div>

  <hr />

  <button id="captureBtn">Debug: Capture &amp; Sanitize Only</button>
  <div id="status">Idle.</div>
  <img id="preview" />
  <div id="domList"></div>

  <script src="popup.js"></script>
</body>
</html>
