<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --navy: #12203D;
      --navy-light: #1D3159;
      --teal: #0FBFA6;
      --teal-dim: #0FBFA633;
      --ink: #14181F;
      --muted: #6B7280;
      --border: #E4E7EC;
      --surface: #F6F7F9;
      --danger: #D6483F;
      --danger-dim: #D6483F1A;
      --success: #1E9E6C;
      --success-dim: #1E9E6C1A;
      --click: #2F6FED;
      --type-action: #0FBFA6;
      --scroll: #8B5CF6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--surface);
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.45;
    }

    header {
      flex-shrink: 0;
      background: var(--navy);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .brand-text { flex: 1; }
    header h1 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    header .subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #9FB3D6;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 0 var(--teal-dim);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--teal-dim); }
      70% { box-shadow: 0 0 0 5px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 6px;
    }
    .empty-state {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      margin-top: 48px;
      padding: 0 20px;
    }
    .empty-state svg { opacity: 0.35; margin-bottom: 10px; }

    .step {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 3px solid var(--muted);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03);
    }
    .step.action-click { border-left-color: var(--click); }
    .step.action-type { border-left-color: var(--type-action); }
    .step.action-scroll { border-left-color: var(--scroll); }
    .step.action-done { border-left-color: var(--success); }
    .step.pending { border-left-color: var(--muted); opacity: 0.7; }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 5px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      margin-right: 7px;
    }
    .step-selector { color: var(--muted); font-size: 11.5px; margin-top: 5px; }
    .step-selector code {
      background: var(--surface);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 11px;
    }
    .step-reasoning { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .step-exec {
      font-size: 11px;
      margin-top: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .exec-ok { color: var(--success); background: var(--success-dim); }
    .exec-fail { color: var(--danger); background: var(--danger-dim); }

    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #inputArea {
      flex-shrink: 0;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    #taskInput {
      width: 100%;
      padding: 9px 10px;
      font-size: 13.5px;
      font-family: inherit;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: none;
      background: var(--surface);
    }
    #taskInput:focus {
      outline: none;
      border-color: var(--teal);
      background: #fff;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    #runTaskBtn { flex: 1; background: var(--navy); color: #fff; border: none; }
    #runTaskBtn:disabled { background: #A7B2C6; cursor: not-allowed; }
    #stopBtn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--danger);
      color: #fff;
      border: none;
    }
    #statusLine {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 8px;
      min-height: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details { margin-top: 10px; }
    summary {
      cursor: pointer;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
      user-select: none;
    }
    #debugCapture { margin-top: 8px; }
    #debugCapture button { width: 100%; background: var(--surface); }
    #debugStatus { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
    #debugPreview { width: 100%; margin-top: 7px; border: 1px solid var(--border); border-radius: 6px; display: none; }
    #debugDomList {
      max-height: 100px;
      overflow-y: auto;
      font-size: 10.5px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      margin-top: 7px;
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .sensitive { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2L28 6.5V15C28 22.5 22.8 27.8 16 30C9.2 27.8 4 22.5 4 15V6.5L16 2Z" fill="#1D3159" stroke="#0FBFA6" stroke-width="1.4"/>
      <circle cx="16" cy="15" r="5" stroke="#0FBFA6" stroke-width="1.5" fill="none"/>
      <circle cx="16" cy="15" r="1.6" fill="#0FBFA6"/>
    </svg>
    <div class="brand-text">
      <h1>Vision Agent</h1>
      <div class="subtitle"><span class="pulse-dot"></span>On-device redaction active</div>
    </div>
  </header>

  <div id="log">
    <div class="empty-state" id="emptyState">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2L28 6.5V15C28 22.5 22.8 27.8 16 30C9.2 27.8 4 22.5 4 15V6.5L16 2Z" stroke="#6B7280" stroke-width="1.4"/>
        <circle cx="16" cy="15" r="5" stroke="#6B7280" stroke-width="1.5"/>
      </svg>
      <div>Give the agent a task below to get started.</div>
    </div>
  </div>

  <div id="inputArea">
    <textarea id="taskInput" rows="2" placeholder="e.g. click the login button"></textarea>
    <div class="btn-row">
      <button id="runTaskBtn">Run Agent</button>
      <button id="stopBtn" title="Stop the agent now" aria-label="Stop agent">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect width="10" height="10" rx="1.5"/></svg>
        Stop
      </button>
    </div>
    <div id="statusLine">Idle.</div>

    <details>
      <summary>Debug: capture &amp; sanitize only</summary>
      <div id="debugCapture">
        <button id="captureBtn">Capture &amp; Sanitize Current Tab</button>
        <div id="debugStatus">Idle.</div>
        <img id="debugPreview" />
        <div id="debugDomList"></div>
      </div>
    </details>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
